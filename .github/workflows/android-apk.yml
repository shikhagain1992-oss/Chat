name: Build NexChat Pro Android APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK & Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Required for AGP 9.x and Gradle 9.x)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup Environment Files & Keystore
        run: |
          # 1. Setup .env file for secrets gradle plugin
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

          # 2. Decode debug.keystore from base64 if needed
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 3. Generate google-services.json if missing
          if [ ! -f app/google-services.json ]; then
            echo "Generating app/google-services.json..."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "418090114272",
              "project_id": "nexchat-pro-8e480",
              "storage_bucket": "nexchat-pro-8e480.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:418090114272:android:5fa7216cbe67cb724c94bf",
                  "android_client_info": {
                    "package_name": "com.sayan.nexchatpro"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyAb6XQuA5QqqoglYSvtQ-cjpOuuV3s_vwo"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

          # 4. Ensure gradlew is executable
          chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Build Release Bundle (AAB) & APK (if signing available)
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew bundleRelease assembleRelease --stacktrace || echo "Release build skipped without release key"
          else
            gradle bundleRelease assembleRelease --stacktrace || echo "Release build skipped without release key"
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexChat-Pro-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release Artifacts (if generated)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NexChat-Pro-Release-Bundle
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          retention-days: 14
