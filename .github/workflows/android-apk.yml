name: Build NexChat Pro Android APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK & Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate google-services.json if missing
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "Creating app/google-services.json..."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "418090114272",
              "project_id": "nexchat-pro-8e480",
              "storage_bucket": "nexchat-pro-8e480.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:418090114272:android:5fa7216cbe67cb724c94bf",
                  "android_client_info": {
                    "package_name": "com.sayan.nexchatpro"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyAb6XQuA5QqqoglYSvtQ-cjpOuuV3s_vwo"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Build Release Bundle (AAB) & APK (if signing available)
        run: |
          gradle bundleRelease assembleRelease --stacktrace || echo "Release build skipped without release keystore"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexChat-Pro-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release Artifacts (if generated)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NexChat-Pro-Release-Bundle
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          retention-days: 14
